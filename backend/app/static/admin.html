<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaidya AI - Admin Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            padding: 40px;
            width: 100%;
            max-width: 460px;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 22px;
            color: #1a1a1a;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 14px;
            color: #666;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 6px;
        }

        label .required {
            color: #e53e3e;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            color: #1a1a1a;
            transition: border-color 0.2s;
            outline: none;
        }

        input:focus {
            border-color: #25d366;
            box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.1);
        }

        input::placeholder {
            color: #a0aec0;
        }

        /* Custom scrollable dropdown */
        .custom-select {
            position: relative;
        }

        .custom-select-trigger {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            color: #1a1a1a;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: border-color 0.2s;
        }

        .custom-select-trigger:hover {
            border-color: #cbd5e0;
        }

        .custom-select.open .custom-select-trigger {
            border-color: #25d366;
            box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.1);
        }

        .custom-select-options {
            display: none;
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: white;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
        }

        .custom-select.open .custom-select-options {
            display: block;
        }

        .custom-select-options::-webkit-scrollbar {
            width: 6px;
        }

        .custom-select-options::-webkit-scrollbar-track {
            background: #f7fafc;
            border-radius: 0 8px 8px 0;
        }

        .custom-select-options::-webkit-scrollbar-thumb {
            background: #cbd5e0;
            border-radius: 3px;
        }

        .custom-select-options::-webkit-scrollbar-thumb:hover {
            background: #a0aec0;
        }

        .custom-option {
            padding: 10px 14px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .custom-option:hover {
            background: #f0fff4;
        }

        .custom-option.selected {
            background: #f0fff4;
            color: #25d366;
            font-weight: 500;
        }

        .phone-input {
            display: flex;
            gap: 8px;
        }

        .phone-input .country-code {
            width: 80px;
            flex-shrink: 0;
            text-align: center;
            background: #f7fafc;
            font-weight: 500;
        }

        .phone-input .phone-number {
            flex: 1;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #25d366;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }

        .submit-btn:hover {
            background: #1fb855;
        }

        .submit-btn:disabled {
            background: #a0aec0;
            cursor: not-allowed;
        }

        .submit-btn.loading {
            position: relative;
            color: transparent;
        }

        .submit-btn.loading::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin: -10px 0 0 -10px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 16px;
            display: none;
        }

        .alert.success {
            background: #f0fff4;
            color: #276749;
            border: 1px solid #c6f6d5;
            display: block;
        }

        .alert.error {
            background: #fff5f5;
            color: #c53030;
            border: 1px solid #fed7d7;
            display: block;
        }

        .whatsapp-icon {
            display: inline-block;
            width: 28px;
            height: 28px;
            vertical-align: middle;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <svg class="whatsapp-icon" viewBox="0 0 24 24" fill="#25d366">
                    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
                </svg>
                Send Pre-Consultation
            </h1>
            <p>Initiate AI intake via WhatsApp</p>
        </div>

        <form id="initiateForm">
            <div class="form-group">
                <label>Patient Phone <span class="required">*</span></label>
                <div class="phone-input">
                    <input type="text" class="country-code" value="+91" readonly>
                    <input type="tel" class="phone-number" id="phoneNumber" placeholder="9876543210" required maxlength="10" pattern="[0-9]{10}">
                </div>
            </div>

            <div class="form-group">
                <label>Patient Name <span class="required">*</span></label>
                <input type="text" id="patientName" placeholder="Enter patient name" required maxlength="200">
            </div>

            <div class="form-group">
                <label>Specialty <span class="required">*</span></label>
                <input type="hidden" id="specialty" required>
                <div class="custom-select" id="customSelect">
                    <div class="custom-select-trigger" id="selectTrigger">
                        <span id="selectText">Select specialty</span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </div>
                    <div class="custom-select-options" id="selectOptions">
                        <div class="custom-option" data-value="general_md">General MD</div>
                        <div class="custom-option" data-value="cardiology">Cardiology</div>
                        <div class="custom-option" data-value="neurology">Neurology</div>
                        <div class="custom-option" data-value="dermatology">Dermatology</div>
                        <div class="custom-option" data-value="gastroenterology">Gastroenterology</div>
                        <div class="custom-option" data-value="orthopedic">Orthopedic</div>
                        <div class="custom-option" data-value="ent">ENT</div>
                        <div class="custom-option" data-value="gynecology">Gynecology</div>
                        <div class="custom-option" data-value="psychiatry">Psychiatry</div>
                        <div class="custom-option" data-value="pulmonology">Pulmonology</div>
                        <div class="custom-option" data-value="urology">Urology</div>
                        <div class="custom-option" data-value="general_surgery">General Surgery</div>
                        <div class="custom-option" data-value="ophthalmology">Ophthalmology</div>
                    </div>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Send to Patient</button>
        </form>

        <div class="alert" id="alertBox"></div>
    </div>

    <script>
        const form = document.getElementById('initiateForm');
        const submitBtn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('alertBox');
        const phoneInput = document.getElementById('phoneNumber');
        const customSelect = document.getElementById('customSelect');
        const selectTrigger = document.getElementById('selectTrigger');
        const selectText = document.getElementById('selectText');
        const selectOptions = document.getElementById('selectOptions');
        const hiddenInput = document.getElementById('specialty');

        // Custom dropdown logic
        selectTrigger.addEventListener('click', () => {
            customSelect.classList.toggle('open');
        });

        document.addEventListener('click', (e) => {
            if (!customSelect.contains(e.target)) {
                customSelect.classList.remove('open');
            }
        });

        selectOptions.addEventListener('click', (e) => {
            const option = e.target.closest('.custom-option');
            if (!option) return;

            // Remove previous selection
            selectOptions.querySelectorAll('.custom-option').forEach(o => o.classList.remove('selected'));
            option.classList.add('selected');

            hiddenInput.value = option.dataset.value;
            selectText.textContent = option.textContent;
            customSelect.classList.remove('open');
        });

        // Only allow numbers in phone field
        phoneInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const phone = phoneInput.value.trim();
            const name = document.getElementById('patientName').value.trim();
            const specialty = hiddenInput.value;

            // Validate
            if (phone.length !== 10) {
                showAlert('error', 'Please enter a valid 10-digit phone number.');
                return;
            }

            if (!specialty) {
                showAlert('error', 'Please select a specialty.');
                return;
            }

            // Disable button, show loading
            submitBtn.disabled = true;
            submitBtn.classList.add('loading');
            alertBox.className = 'alert';

            try {
                const response = await fetch('/api/v1/whatsapp/initiate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        patient_phone: '91' + phone,
                        patient_name: name,
                        specialty: specialty,
                    }),
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showAlert('success', `Message sent to +91${phone}. Session: ${data.session_id.slice(0, 8)}...`);
                    form.reset();
                    // Reset custom dropdown
                    selectText.textContent = 'Select specialty';
                    hiddenInput.value = '';
                    selectOptions.querySelectorAll('.custom-option').forEach(o => o.classList.remove('selected'));
                } else if (response.status === 409) {
                    showAlert('error', 'This patient already has an active session.');
                } else {
                    showAlert('error', data.detail || data.message || 'Something went wrong. Please try again.');
                }
            } catch (err) {
                showAlert('error', 'Network error. Make sure the backend is running.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('loading');
            }
        });

        function showAlert(type, message) {
            alertBox.className = `alert ${type}`;
            alertBox.textContent = message;
        }
    </script>
</body>
</html>

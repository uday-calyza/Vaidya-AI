# =============================================================================
# CI/CD: Build Backend Docker Image → Push to ECR → Deploy to EC2 via SSM
# =============================================================================
# Uses OIDC — no AWS access keys needed.
#
# Required GitHub Secrets:
#   AWS_ROLE_ARN_BACKEND         - IAM Role ARN for backend deploy (from CloudFormation output)
#   TAVILY_API_KEY               - Tavily search API key
#   WHATSAPP_PHONE_NUMBER_ID     - Meta WhatsApp phone number ID
#   WHATSAPP_ACCESS_TOKEN        - Meta WhatsApp access token
#   WHATSAPP_VERIFY_TOKEN        - WhatsApp webhook verify token
#
# Required GitHub Variables:
#   EC2_INSTANCE_ID              - EC2 Instance ID (from CloudFormation output)
#   ECR_REPOSITORY               - ECR repository name (vaidya-ai-backend)
# =============================================================================

name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  BEDROCK_MODEL_ID: "global.anthropic.claude-haiku-4-5-20251001-v1:0"

jobs:
  build-and-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_BACKEND }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'vaidya-ai-backend' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd backend
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "ECR_REGISTRY=$ECR_REGISTRY" >> $GITHUB_ENV
          echo "ECR_REPOSITORY=$ECR_REPOSITORY" >> $GITHUB_ENV

      - name: Deploy to EC2 via SSM
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          IMAGE="$ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY || 'vaidya-ai-backend' }}:latest"

          aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID || secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[
              \"aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com\",
              \"docker pull $IMAGE\",
              \"docker stop vaidya-backend 2>/dev/null || true\",
              \"docker rm vaidya-backend 2>/dev/null || true\",
              \"docker run -d --name vaidya-backend --restart unless-stopped -p 8000:8000 -e APP_ENV=production -e AWS_REGION=${{ env.AWS_REGION }} -e BEDROCK_MODEL_ID=${{ env.BEDROCK_MODEL_ID }} -e TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }} -e WHATSAPP_API_URL=https://graph.facebook.com/v25.0 -e WHATSAPP_PHONE_NUMBER_ID=${{ secrets.WHATSAPP_PHONE_NUMBER_ID }} -e WHATSAPP_ACCESS_TOKEN=${{ secrets.WHATSAPP_ACCESS_TOKEN }} -e WHATSAPP_VERIFY_TOKEN=${{ secrets.WHATSAPP_VERIFY_TOKEN }} -e CORS_ORIGINS=* $IMAGE\",
              \"sleep 5\",
              \"curl -f http://localhost:8000/health || echo Health check failed\",
              \"docker image prune -f\"
            ]" \
            --comment "Deploy vaidya-ai-backend" \
            --region ${{ env.AWS_REGION }} \
            --output text \
            --query "Command.CommandId" > /tmp/cmd_id.txt

          CMD_ID=$(cat /tmp/cmd_id.txt)
          echo "SSM Command ID: $CMD_ID"

          # Wait for command to complete
          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID || secrets.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text \
              --region ${{ env.AWS_REGION }} 2>/dev/null || echo "Pending")
            echo "Status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "Deployment successful!"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "Deployment failed!"
              exit 1
            fi
            sleep 10
          done

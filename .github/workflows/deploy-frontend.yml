# =============================================================================
# CI/CD: Build Frontend → Deploy to S3 → Invalidate CloudFront
# =============================================================================
# Triggers on push to main when frontend/ files change.
#
# Required GitHub Secrets:
#   AWS_ACCESS_KEY_ID       - IAM user access key (with S3 + CloudFront permissions)
#   AWS_SECRET_ACCESS_KEY   - IAM user secret key
#   BACKEND_URL             - Elastic IP backend URL, e.g. "http://13.232.x.x:8000"
#   S3_BUCKET               - Frontend S3 bucket name
#   CLOUDFRONT_DISTRIBUTION_ID - CloudFront distribution ID
# =============================================================================

name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: # Allow manual trigger

env:
  AWS_REGION: ap-south-1

jobs:
  build-and-deploy:
    name: Build & Deploy to S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE: "/api/v1"
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          # Find the build output directory
          if [ -d "frontend/dist" ]; then
            BUILD_DIR="frontend/dist"
          elif [ -d "frontend/.output/public" ]; then
            BUILD_DIR="frontend/.output/public"
          elif [ -d "frontend/dist/client" ]; then
            BUILD_DIR="frontend/dist/client"
          elif [ -d "frontend/build" ]; then
            BUILD_DIR="frontend/build"
          else
            echo "ERROR: Could not find build output directory"
            echo "Listing frontend directory:"
            ls -la frontend/
            exit 1
          fi

          echo "Deploying from: $BUILD_DIR"
          aws s3 sync $BUILD_DIR s3://${{ secrets.S3_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "## Frontend Deployed!" >> $GITHUB_STEP_SUMMARY
          echo "- S3 Bucket: \`${{ secrets.S3_BUCKET }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- CloudFront invalidation triggered" >> $GITHUB_STEP_SUMMARY
          echo "- Backend URL: \`${{ secrets.BACKEND_URL }}\`" >> $GITHUB_STEP_SUMMARY
